<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIForge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 12px; padding: 40px; width: 480px; }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    p { color: #888; font-size: 0.9rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input[type=file] { width: 100%; padding: 10px; border: 1px dashed #3a3a3a; border-radius: 8px; background: #111; color: #e8e8e8; cursor: pointer; margin-bottom: 20px; }
    select { width: 100%; padding: 10px; border: 1px solid #3a3a3a; border-radius: 8px; background: #111; color: #e8e8e8; margin-bottom: 28px; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; background: #4f6ef7; border: none; border-radius: 8px; color: white; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #3b5ce0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>UIForge</h1>
    <p>Upload a UI screenshot to decompose it into components and generate code.</p>
    <form method="post" action="/analyze" enctype="multipart/form-data">
      <label for="file">Screenshot</label>
      <input type="file" id="file" name="file" accept="image/*" required />
      <label for="target">Output target</label>
      <select id="target" name="target">
        <option value="react_native">React Native</option>
        <option value="html">HTML</option>
      </select>
      <button type="submit">Analyze</button>
    </form>
  </div>
</body>
</html>
